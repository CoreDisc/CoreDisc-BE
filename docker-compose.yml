---
version: '3.8'
services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
  prometheus:
    image: prom/prometheus:latest
    ports:
    - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 컨테이너 -> 호스트 접근용
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"